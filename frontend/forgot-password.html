<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | SmartCare Queue AI</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="../css/accessibility.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-container" style="max-width: 650px; grid-template-columns: 1fr;">
      <div class="auth-main" style="padding: 3rem;">
        <div style="text-align: center; margin-bottom: 2rem;">
          <a href="index.html" class="brand-logo" style="justify-content: center; margin-bottom: 1rem;">
            <span>🏥</span> SmartCare Queue AI
          </a>
          <h2>Forgot Your Password?</h2>
          <p>Enter your registered email address and we'll dispatch password reset instructions.</p>
        </div>

        <form id="forgot-password-form">
          <div class="form-group">
            <label class="form-label" for="reset-email">Registered Email</label>
            <input type="email" id="reset-email" class="form-control" placeholder="name@example.com" required autocomplete="email">
          </div>

          <button type="submit" id="reset-btn" class="btn btn-primary btn-block btn-lg" style="margin-top: 1rem;">
            Send Reset Link
          </button>
        </form>

        <div class="auth-footer">
          Remember your credentials? <a href="login.html" style="font-weight: 600;">Return to Login</a>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/accessibility.js"></script>
  <script>
    document.getElementById('forgot-password-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('reset-email').value.trim();
      const btn = document.getElementById('reset-btn');

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Dispatching link...';

      try {
        const res = await window.api.post('/auth/forgot-password', { email });
        window.api.showToast(res.message, 'success');
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 2000);
      } catch (err) {
        window.api.showToast(err.message, 'danger');
        btn.disabled = false;
        btn.innerHTML = 'Send Reset Link';
      }
    });
  </script>
</body>
</html>
